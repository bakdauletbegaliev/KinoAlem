<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoAlem — Contact</title>
    <link href="vendor/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
            <div class="container">
                <a class="navbar-brand fw-bold text-danger fs-3" href="index.html">KinoAlem</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="movies.html">Movies</a></li>
                        <li class="nav-item"><a class="nav-link" href="discover.html">Discover</a></li>
                        <li class="nav-item"><a class="nav-link" href="watchlist.html">Watchlist</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5 text-white" style="max-width: 600px;">
        <h1 class="text-center mb-4">Contact Us</h1>
        <form id="contact-form" class="bg-dark p-4 rounded border border-secondary" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label">Your Name</label>
                <input type="text" class="form-control bg-dark text-white border-secondary" id="name" name="name" placeholder="Enter your name" autocomplete="name" required minlength="2" aria-describedby="name-error">
                <div id="name-error" class="invalid-feedback" role="alert"></div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control bg-dark text-white border-secondary" id="email" name="email" placeholder="name@example.com" autocomplete="email" required aria-describedby="email-error">
                <div id="email-error" class="invalid-feedback" role="alert"></div>
            </div>
            <div class="mb-3">
                <label for="subject" class="form-label">Subject</label>
                <input type="text" class="form-control bg-dark text-white border-secondary" id="subject" name="subject" placeholder="What is this regarding?" maxlength="80">
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control bg-dark text-white border-secondary" id="message" name="message" rows="4" placeholder="Type your message here..." required minlength="10" maxlength="500" aria-describedby="message-error"></textarea>
                <div id="message-error" class="invalid-feedback" role="alert"></div>
            </div>
            <button type="submit" class="btn btn-danger w-100">Check message</button>
            <p class="mt-3 mb-0" role="status" id="feedback-status" aria-live="polite">Classroom demo. Your message is checked on this page; it is not sent.</p>
        </form>
    </main>

    <footer class="bg-dark text-white text-center py-4 border-top border-secondary">
        <div class="container">
            <p class="mb-1">&copy; 2026 KinoAlem. All rights reserved.</p>
        </div>
    </footer>

    <script src="vendor/bootstrap.bundle.min.js"></script>
    <script src="team/Bakdaulet/contact.js"></script>
</body>
</html>
